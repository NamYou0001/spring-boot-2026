
spring:
  application:
    name: spring-security

  datasource:
    url: jdbc:postgresql://localhost:5432/security_lab
    username: postgres
    password: "123"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    issuer: spring-security
    audience: security-api
    access-token-ttl: 10m
    secret-base64: ${JWT_SECRET_BASE64:zLFW7/MtTjAmvvN5ekAx+bT/Z/TzDj4D8tvv8xclFTI=}
server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
